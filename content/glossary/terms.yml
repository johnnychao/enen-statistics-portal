- id: observational-unit
  en: "observational unit"
  zh_tw: "觀察單位"
  intuition_zh: "資料中被觀察的一個人、物件或案例，通常對應一列"
  response_en: "Each observational unit is one synthetic student response represented by one row."
  common_confusion: "觀察單位不是變數；變數是對每個觀察單位記錄的特徵。"
- id: variable
  en: "variable"
  zh_tw: "變數"
  intuition_zh: "在不同觀察單位之間可能改變的特徵，通常對應一欄"
  response_en: "The variable records a characteristic that can vary across observational units."
  common_confusion: "不要把某一格的觀察值當成整個變數。"
- id: value
  en: "value"
  zh_tw: "觀察值"
  intuition_zh: "某個觀察單位在某一變數上的實際紀錄"
  response_en: "This value is the recorded commute time for one observational unit."
  common_confusion: "觀察值是單一紀錄；樣本統計量是由多個觀察值計算而得。"
- id: identifier
  en: "identifier"
  zh_tw: "識別碼"
  intuition_zh: "用來區分資料列的代碼，不代表可比較的數量"
  response_en: "The student ID is an identifier rather than a quantitative measurement."
  common_confusion: "識別碼即使以數字儲存，也不適合計算平均數。"
- id: categorical-variable
  en: "categorical variable"
  zh_tw: "類別變數"
  intuition_zh: "把觀察單位分到名稱或群組的變數"
  response_en: "Commute mode is categorical because its values label travel groups."
  common_confusion: "類別值可以用數字編碼；判斷重點是數字差距是否有量的意義。"
- id: quantitative-variable
  en: "quantitative variable"
  zh_tw: "數值變數"
  intuition_zh: "數值大小與差距具有實質數量意義的變數"
  response_en: "Commute time is quantitative because differences in minutes are meaningful."
  common_confusion: "不是所有含數字的欄位都是數值變數，例如識別碼。"
- id: frequency
  en: "frequency"
  zh_tw: "次數"
  intuition_zh: "某類別或區間在資料中出現的筆數"
  response_en: "The frequency is the number of valid responses in this category."
  common_confusion: "比較不同大小的群組時，次數可能不如相對次數公平。"
- id: relative-frequency
  en: "relative frequency"
  zh_tw: "相對次數"
  intuition_zh: "某類別次數占有效觀測總數的份額"
  response_en: "The relative frequency equals the category count divided by the number of valid responses."
  common_confusion: "計算前要說清楚分母是否排除缺失值。"
- id: proportion
  en: "proportion"
  zh_tw: "比例"
  intuition_zh: "部分占整體的份額，介於 0 與 1"
  response_en: "The sample proportion who use public transit is the count divided by the sample size."
  common_confusion: "兩個百分比相減得到的是百分點差，不一定是百分比增加率。"
- id: two-way-table
  en: "two-way table"
  zh_tw: "雙向表"
  intuition_zh: "同時整理兩個類別變數組合次數的表格"
  response_en: "The two-way table displays commute mode counts within each grade level."
  common_confusion: "條件比例的分母由題目中的條件群組決定，不能任意使用總人數。"
- id: bar-chart
  en: "bar chart"
  zh_tw: "長條圖"
  intuition_zh: "以分離長條比較類別的次數或比例"
  response_en: "A bar chart is appropriate because commute mode is categorical."
  common_confusion: "類別長條可重新排序且彼此分離；直方圖的數值區間有固定順序且相接。"
- id: dotplot
  en: "dotplot"
  zh_tw: "點圖"
  intuition_zh: "在數線上用點保留每一筆數值的位置"
  response_en: "The dotplot preserves individual observations and makes gaps visible."
  common_confusion: "點重疊的高度表示同一或相近數值的次數，不是第二個數值變數。"
- id: histogram
  en: "histogram"
  zh_tw: "直方圖"
  intuition_zh: "把數值變數分入連續區間以呈現整體形狀"
  response_en: "A histogram reveals the overall shape of the quantitative distribution."
  common_confusion: "組距會影響外觀；不可把最高長條的位置直接當成平均數。"
- id: distribution
  en: "distribution"
  zh_tw: "分布"
  intuition_zh: "資料值出現的位置、頻率與整體樣貌"
  response_en: "The distribution of commute times is right-skewed with a few unusually high values."
  common_confusion: "在本單元中，分布不只指機率分配，也指樣本資料的整體型態。"
- id: shape
  en: "shape"
  zh_tw: "分布形狀"
  intuition_zh: "分布是否對稱、偏斜、單峰、多峰或有間隔"
  response_en: "The shape is unimodal and moderately right-skewed."
  common_confusion: "形狀要由整體圖形判斷，不能只看一個數值。"
- id: symmetric
  en: "symmetric"
  zh_tw: "對稱"
  intuition_zh: "分布中心左右兩側的形狀大致互相對應"
  response_en: "The distribution is approximately symmetric around its center."
  common_confusion: "近似對稱不要求每一對數值完全鏡像，也不保證平均數恰等於中位數。"
- id: skewed-right
  en: "skewed right"
  zh_tw: "右偏"
  intuition_zh: "少數較大值讓分布的右尾較長"
  response_en: "The distribution is right-skewed because the longer tail extends toward larger values."
  common_confusion: "右偏由尾巴方向命名，不代表多數資料集中在右側。"
- id: skewed-left
  en: "skewed left"
  zh_tw: "左偏"
  intuition_zh: "少數較小值讓分布的左尾較長"
  response_en: "The distribution is left-skewed because the longer tail extends toward smaller values."
  common_confusion: "左偏不是指最高長條位於左側，而是左尾較長。"
- id: outlier
  en: "potential outlier"
  zh_tw: "可能的離群值"
  intuition_zh: "與大多數資料相距明顯、值得進一步查核的值"
  response_en: "The observation is a potential outlier and should be investigated before any decision to remove it."
  common_confusion: "被規則標示不等於輸入錯誤，也不代表可以自動刪除。"
- id: mean
  en: "mean"
  zh_tw: "平均數"
  intuition_zh: "把總量平均分配後的平衡點"
  response_en: "The sample mean is the total of all observed values divided by the sample size."
  common_confusion: "平均數使用每一個值，因此容易受到極端值與偏態影響。"
- id: median
  en: "median"
  zh_tw: "中位數"
  intuition_zh: "資料排序後位於中央的位置"
  response_en: "The median is a resistant measure of center for this right-skewed distribution."
  common_confusion: "中位數把排序位置分成上下兩半，不表示一半資料等於該數值。"
- id: range
  en: "range"
  zh_tw: "全距"
  intuition_zh: "最大值減最小值所得的完整跨度"
  response_en: "The range is the maximum value minus the minimum value."
  common_confusion: "全距只使用兩個端點，容易受極端值影響。"
- id: quartile
  en: "quartile"
  zh_tw: "四分位數"
  intuition_zh: "把排序資料切成四個大致等量部分的位置"
  response_en: "The first and third quartiles mark the boundaries of the middle 50% of the data."
  common_confusion: "不同軟體可能採略有差異的四分位數計算慣例，解讀時要保持一致。"
- id: iqr
  en: "interquartile range"
  zh_tw: "四分位距"
  intuition_zh: "中間 50% 資料的數值跨度"
  response_en: "The IQR equals Q3 minus Q1 and describes the spread of the middle 50%."
  common_confusion: "四分位距是一個距離，不是中間 50% 的資料筆數。"
- id: standard-deviation
  en: "standard deviation"
  zh_tw: "標準差"
  intuition_zh: "資料值與平均數之間的典型距離尺度"
  response_en: "The standard deviation indicates that observations typically differ from the mean by about this many units."
  common_confusion: "標準差不是全距或標準誤；它的單位與原變數相同。"
- id: five-number-summary
  en: "five-number summary"
  zh_tw: "五數摘要"
  intuition_zh: "最小值、第一四分位數、中位數、第三四分位數與最大值的整體摘要"
  response_en: "The five-number summary describes the center and spread using the minimum, quartiles, and maximum."
  common_confusion: "五數摘要不包含平均數或標準差。"
- id: boxplot
  en: "boxplot"
  zh_tw: "箱形圖"
  intuition_zh: "以中位數、四分位數與鬚快速比較分布位置和變異"
  response_en: "The side-by-side boxplots compare medians, IQRs, and potential outliers across groups."
  common_confusion: "箱體較長表示中間 50% 的數值跨度較大，不表示其中人數較多。"
- id: population
  en: "population"
  zh_tw: "母體"
  intuition_zh: "研究問題真正希望了解的完整群體"
  response_en: "The population of interest is all students currently enrolled at the school."
  common_confusion: "母體由研究問題界定，不一定是所有人。"
- id: sample
  en: "sample"
  zh_tw: "樣本"
  intuition_zh: "實際被選取並提供可用資料的母體子集"
  response_en: "The sample consists of the students whose responses were analyzed."
  common_confusion: "原先被抽中者與最後回覆者可能不同，需報告未回覆情形。"
- id: parameter
  en: "parameter"
  zh_tw: "母體參數"
  intuition_zh: "描述母體、通常未知的固定數值"
  response_en: "The parameter is the true mean readiness score for the population."
  common_confusion: "母體參數描述母體；樣本統計量由樣本計算。"
- id: statistic
  en: "statistic"
  zh_tw: "樣本統計量"
  intuition_zh: "由樣本資料計算、用來描述樣本或估計母體的數值"
  response_en: "The sample mean is a statistic calculated from the selected students."
  common_confusion: "統計量計算正確不代表樣本一定具代表性。"
- id: sampling-frame
  en: "sampling frame"
  zh_tw: "抽樣框"
  intuition_zh: "實際用來抽取樣本的名單或可及集合"
  response_en: "The current enrollment roster serves as the sampling frame."
  common_confusion: "抽樣框若漏掉部分母體，就可能造成涵蓋不足。"
- id: random-sampling
  en: "random sampling"
  zh_tw: "隨機抽樣"
  intuition_zh: "以機率程序從抽樣框選取觀察單位"
  response_en: "Random sampling supports generalization to the population represented by the frame."
  common_confusion: "隨機抽樣處理代表性；隨機分派處理因果比較。"
- id: simple-random-sample
  en: "simple random sample (SRS)"
  zh_tw: "簡單隨機樣本"
  intuition_zh: "每個同樣大小的可能樣本都有相同被選機會的設計"
  response_en: "Assign each student a number and use a random-number generator to select an SRS without replacement."
  common_confusion: "簡單隨機樣本不是隨便找人，也不是由研究者主觀挑選看似典型者。"
- id: stratified-random-sample
  en: "stratified random sample"
  zh_tw: "分層隨機樣本"
  intuition_zh: "先分成重要子群，再從每一層各自隨機抽樣"
  response_en: "Separate students by grade and select an SRS from every grade-level stratum."
  common_confusion: "分層抽樣會從每一層抽人；集群抽樣只抽部分群集。"
- id: cluster-sample
  en: "cluster sample"
  zh_tw: "集群樣本"
  intuition_zh: "隨機選取部分自然群集，再調查被選群集中的個體"
  response_en: "Randomly select classroom clusters and survey students in the selected classrooms."
  common_confusion: "方便選幾個班級不是集群樣本；群集本身也要隨機選。"
- id: convenience-sample
  en: "convenience sample"
  zh_tw: "便利樣本"
  intuition_zh: "選擇最容易接觸或取得的個體"
  response_en: "Surveying the first students to arrive produces a convenience sample."
  common_confusion: "樣本很大仍不能自動修正便利取樣造成的系統性偏誤。"
- id: voluntary-response-sample
  en: "voluntary response sample"
  zh_tw: "自願回覆樣本"
  intuition_zh: "由個體自行決定是否加入的樣本"
  response_en: "An open survey link may overrepresent students with strong opinions."
  common_confusion: "自願回覆不是隨機抽樣，願意回覆者可能與未回覆者不同。"
- id: bias
  en: "bias"
  zh_tw: "偏誤"
  intuition_zh: "研究方法使結果系統性偏離目標真值"
  response_en: "This data-collection method may systematically overestimate the population mean."
  common_confusion: "偏誤是系統性問題，不是一次樣本因機率而與母體不同。"
- id: undercoverage
  en: "undercoverage"
  zh_tw: "涵蓋不足"
  intuition_zh: "部分母體成員很難或不可能進入抽樣框或樣本"
  response_en: "Surveying only on-time arrivals undercovers students who arrive late."
  common_confusion: "涵蓋不足發生在可被選取的機會；未回覆發生在已選取者沒有回覆。"
- id: nonresponse-bias
  en: "nonresponse bias"
  zh_tw: "未回覆偏誤"
  intuition_zh: "已被選取但未回覆者與回覆者有系統性差異"
  response_en: "If students with long commutes respond less often, nonresponse may bias the estimate downward."
  common_confusion: "低回覆率帶來風險，但方向需由未回覆者可能如何不同來判斷。"
- id: response-bias
  en: "response bias"
  zh_tw: "回應偏誤"
  intuition_zh: "題目語氣、記憶或社會期待使回答系統性不準確"
  response_en: "A leading question may cause students to underreport late-night screen time."
  common_confusion: "匿名可能降低部分回應偏誤，但不能修正涵蓋不足。"
- id: observational-study
  en: "observational study"
  zh_tw: "觀察研究"
  intuition_zh: "研究者觀察既有條件而不主動分派處理"
  response_en: "This is an observational study because the researchers did not assign commute modes."
  common_confusion: "觀察研究可以發現關聯，但通常不能單獨建立因果關係。"
- id: experiment
  en: "experiment"
  zh_tw: "實驗"
  intuition_zh: "研究者將實驗單位分派至不同處理並比較反應"
  response_en: "This is an experiment because the researchers assigned participants to conditions."
  common_confusion: "只設置比較組但讓學生自選，仍可能受到混淆。"
- id: experimental-unit
  en: "experimental unit"
  zh_tw: "實驗單位"
  intuition_zh: "在實驗中接受處理分派的最小單位"
  response_en: "Each participating student is an experimental unit."
  common_confusion: "實驗單位不一定是人，也不要和量測次數混用。"
- id: explanatory-variable
  en: "explanatory variable"
  zh_tw: "解釋變數"
  intuition_zh: "用來解釋或比較反應變數差異的變數"
  response_en: "The explanatory variable is the assigned morning routine."
  common_confusion: "名稱不代表已證明因果；研究設計才決定能否作因果解釋。"
- id: response-variable
  en: "response variable"
  zh_tw: "反應變數"
  intuition_zh: "研究中要解釋、比較或測量結果的變數"
  response_en: "The response variable is the change in readiness score."
  common_confusion: "反應變數應在分析前明確定義，避免看完結果才挑指標。"
- id: treatment
  en: "treatment"
  zh_tw: "處理"
  intuition_zh: "施加於實驗單位的特定條件"
  response_en: "The treatment is the 15-minute morning-planning routine."
  common_confusion: "處理是條件本身，不是處理組的學生名單。"
- id: control-group
  en: "control group"
  zh_tw: "對照組"
  intuition_zh: "提供基準比較、通常維持既有流程的實驗組別"
  response_en: "The usual-routine group serves as the control group."
  common_confusion: "有對照組仍需適當分派；自選群組可能留下混淆。"
- id: random-assignment
  en: "random assignment"
  zh_tw: "隨機分派"
  intuition_zh: "以隨機方式把實驗單位分配到處理條件"
  response_en: "Random assignment helps balance potential confounders and supports a causal conclusion."
  common_confusion: "隨機分派支持因果，但不自動讓參與者代表更大母體。"
- id: replication
  en: "replication"
  zh_tw: "重複"
  intuition_zh: "讓每種處理包含足夠多實驗單位或重複實施"
  response_en: "Replication reduces the influence of chance variation on the treatment comparison."
  common_confusion: "對同一人重複量測不一定等於增加獨立實驗單位。"
- id: blocking
  en: "blocking"
  zh_tw: "區集設計"
  intuition_zh: "先依重要特徵分組，再於每個區集內隨機分派"
  response_en: "Block by grade level, then randomly assign students within each block."
  common_confusion: "區集設計用於實驗分派；分層設計用於抽樣。"
- id: confounding
  en: "confounding"
  zh_tw: "混淆"
  intuition_zh: "解釋變數的效果與其他因素交織，無法分開辨認"
  response_en: "Commute distance may confound the association between travel mode and commute time."
  common_confusion: "第三變數必須與解釋變數及反應變數都有合理關聯，才構成混淆疑慮。"
- id: association
  en: "association"
  zh_tw: "關聯"
  intuition_zh: "一個變數的值改變時，另一變數的分布也呈現系統性差異"
  response_en: "The sample shows an association between sleep duration and readiness."
  common_confusion: "關聯不等於因果關係；共同變動可能來自混淆。"
- id: generalization
  en: "generalization"
  zh_tw: "推廣"
  intuition_zh: "把樣本結果合理延伸到所代表的目標母體"
  response_en: "Random sampling supports generalization to the population represented by the sampling frame."
  common_confusion: "推廣取決於選樣與涵蓋範圍，不由隨機分派單獨保證。"
- id: causation
  en: "causation"
  zh_tw: "因果關係"
  intuition_zh: "改變解釋變數會造成反應變數改變"
  response_en: "A well-conducted randomized experiment can support a cause-and-effect conclusion for the participants."
  common_confusion: "相關強、樣本大或有時間順序，都不等同於已排除混淆。"
- id: sampling-variability
  en: "sampling variability"
  zh_tw: "抽樣變異"
  intuition_zh: "同一母體重複隨機抽樣時，統計量自然會改變"
  response_en: "Different random samples produce different statistics because of sampling variability."
  common_confusion: "抽樣變異是隨機波動；偏誤是方法造成的系統性偏離。"
